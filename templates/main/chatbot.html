<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reflect AI - Chatbot</title>
        <link rel="stylesheet" href="{{url_for('static', filename='chatbot-styles.css')}}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body>
        <div class="container">
            <div class="navbar">
                <img src="{{url_for('static', filename='assets/logo.png')}}" alt="reflect ai logo" height="60" width="60" style="padding: 5px; margin-right: 65px;">
                <a href="/" style="margin-right: 40px;">Diary Entries</a>
                <a href="/chatbot" style="margin-right: 40px;">Chatbot</a>
                <a class="log-out" id="log-out">LOG OUT</a>
            </div>
            <div class="content">
                <h1 id="welcome-msg">Welcome back!!</h1>
                <br>
                <br>
                <div style="display: flex; gap: 50px;">
                    <div class="personality">
                        <h2>My Personality (AI Overview)</h2>
                        <div class="personality-div">
                            <p id="personality-p"></p>
                        </div>
                        <br>
                        <button id="generate-new-report">Generate New Report</button>
                    </div>
                    <div class="reflect-comp">
                        <div>
                            <h2>Reflect Companion</h2>
                            <div id="reflect-comp-p" class="reflect-comp-div">

                            </div>
                            <br>
                            <div style="display: flex; margin-top: auto;"><input type="text" placeholder="Ask me anything..." id="reflect-comp-input">&emsp;<button style="width: 80px;" id="reflect-comp-send">Send</button></div>
                        </div>
                        <div class="chat-history-div">
                            <h2>Chat History</h2>
                            <div class="chat-history" id="chat-history">

                            </div>
                        </div>
                    </div>
                </div>
                <br>
                <div style="display: flex; gap: 50px;">
                    <div class="core-traits">
                        <h2>Core Traits and Frequent Emotions</h2>
                        <div class="personality-div" id="core-traits">

                        </div>
                        <br>
                        <button id="generate-new-list">Generate New List</button>
                    </div>
                </div>
            </div>
            <br>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="{{url_for('static', filename='scripts/main/chatbot.js')}}"></script>
    </body>
</html>
