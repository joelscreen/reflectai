<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reflect AI - Register</title>
        <link rel="stylesheet" href="{{url_for('static', filename='login-styles.css')}}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body>
        <div class="container">
            <h2>Create a Reflect AI Account!</h2>
            <input id="name" type="text" name="name" placeholder="Name" required>
            <input id="loginid" type="text" name="loginid" placeholder="Login ID" required>
            <input id="email" type="email" name="password" placeholder="Email" required>
            <input id="password" type="password" name="password" placeholder="Password" required>
            <input id="confirm-password" type="password" name="password" placeholder="Confirm Password" required>
            <button type="submit" id="submit">Register</button>
            <br>
            <br>
            Already have an account? <a href="/login">Login Now!!</a>
        </div>
        <script src="{{url_for('static', filename='scripts/login/register.js')}}"></script>
    </body>
</html>
